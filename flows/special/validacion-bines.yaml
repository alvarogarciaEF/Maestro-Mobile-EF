# Proposito: llegar al formulario de captura de tarjeta para validacion de BINes.
# Precondiciones: usuario QA valido, direccion guardada y producto disponible para busqueda.
# Nota: no limpia estado local; el runner batch puede hacerlo una vez con BIN_CLEAR_STATE=1.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Validacion de bines
tags:
  - special
  - checkout
  - payment
  - bines
---
- runFlow: ../reusable/ensure-logged-in.yaml
- runFlow: ../reusable/setup-cart-with-product.yaml
- scrollUntilVisible:
    element:
      id: "btn_continue_shoppig_container"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "btn_continue_shoppig_container"
- assertVisible:
    id: "continueProcessBtn"
- assertVisible:
    id: "transaction_container"
- runFlow:
    when:
      visible: "Confirma tu teléfono"
    commands:
      - tapOn:
          id: "continueProcessBtn"
      - extendedWaitUntil:
          visible: "Elige a quién enviarlo|Escoge un horario|Dedicatoria|Completa el pago"
          timeout: 30000
- runFlow:
    when:
      visible: "Elige a quién enviarlo"
    commands:
      - tapOn:
          id: "continueProcessBtn"
      - extendedWaitUntil:
          visible: "Escoge un horario|Dedicatoria|Completa el pago"
          timeout: 30000
- runFlow:
    when:
      visible: "Escoge un horario"
    commands:
      - tapOn:
          point: "93%,50%"
      - tapOn:
          id: "continueProcessBtn"
      - extendedWaitUntil:
          visible: "Dedicatoria|Completa el pago"
          timeout: 30000
- runFlow:
    when:
      visible: "Dedicatoria"
    commands:
      - tapOn:
          id: "checkbox_without_message"
      - tapOn:
          id: "checkbox_anonymous"
      - tapOn:
          id: "continueProcessBtn"
      - extendedWaitUntil:
          visible: "Completa el pago"
          timeout: 30000
- assertVisible:
    text: "Completa el pago"
- assertVisible:
    text: "Agregar una nueva tarjeta"
- tapOn:
    text: "Agregar una nueva tarjeta"
- assertVisible:
    text: "Agrega una tarjeta de crédito o débito"
- assertVisible:
    id: "add_card_name_edit_text"
- assertVisible:
    id: "add_card_last_name_edit_text"
- assertVisible:
    id: "add_card_card_number_edit_text"
- assertVisible:
    id: "add_card_month_year_edit_text"
- takeScreenshot:
    path: "reports/bines-form-${BIN_NUMBER}"
# Importante: no tocar "Usar esta tarjeta" ni confirmar pago desde este flow.
- assertVisible:
    text: "Usar esta tarjeta"
- tapOn:
    id: "add_card_card_number_edit_text"
- eraseText
- inputText: ${BIN_CARD_NUMBER}
- takeScreenshot:
    path: "reports/bines-card-${BIN_NUMBER}"

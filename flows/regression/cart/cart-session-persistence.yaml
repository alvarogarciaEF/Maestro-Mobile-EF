# Proposito: validar que el carrito autenticado persiste tras relanzar app y re-login.
# Web parity: tests/smoke/shopping-cart/cart-session-persistence.spec.js (parcial)
# Precondiciones: USER_EMAIL/USER_PASSWORD validos; PRODUCT_NAME disponible.
# Valida: producto en carrito tras relaunch y tras logout + login.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Regression - Cart Session Persistence
tags:
  - regression
  - cart
  - auth
  - session
  - web-parity
---
- clearState
- runFlow: ../../reusable/ensure-logged-in.yaml
- runFlow: ../../reusable/setup-cart-with-product.yaml
- assertVisible:
    text: ${PRODUCT_NAME}
- launchApp:
    stopApp: false
- runFlow: ../../reusable/close-modals.yaml
- runFlow: ../../reusable/navigate-cart-tab.yaml
- assertVisible:
    text: ${PRODUCT_NAME}
- runFlow: ../../reusable/logout.yaml
- runFlow: ../../reusable/login-email-password.yaml
- runFlow: ../../reusable/navigate-cart-tab.yaml
- assertVisible:
    text: ${PRODUCT_NAME}

# Proposito: validar recuperacion de password con correo inexistente.
# Precondiciones: RECOVERY_UNKNOWN_EMAIL no asociado a cuenta QA.
# Valida: mensaje de correo no encontrado sin enviar enlace exitoso.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Regression - Recover Password Email Not Found
tags:
  - regression
  - auth
  - recovery
  - negative
---
- clearState
- runFlow: ../../reusable/open-recover-password.yaml
- tapOn:
    id: "recoveryPasswordEmailEditText"
- inputText: ${RECOVERY_UNKNOWN_EMAIL}
- tapOn:
    id: "send_link_text"
- extendedWaitUntil:
    visible:
      text: "Intentar de nuevo|Crear cuenta"
    timeout: 20000
- assertVisible:
    text: "Intentar de nuevo|Crear cuenta"
- assertNotVisible:
    text: "¡Revisa tu correo! Te enviamos algo"
- tapOn:
    text: "Intentar de nuevo"
    optional: true

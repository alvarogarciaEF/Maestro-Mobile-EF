# Proposito: validar solicitud de restablecimiento de contrasena por correo.
# Precondiciones: USER_EMAIL asociado a cuenta QA activa.
# Valida: confirmacion de envio de enlace sin cambiar contrasena.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
env:
  USER_EMAIL: ${USER_EMAIL || "enviafloresQA@mailinator.com"}
name: Regression - Recover Password
tags:
  - regression
  - auth
  - recovery
---
- clearState
- runFlow: ../../reusable/open-recover-password.yaml
- tapOn:
    id: "recoveryPasswordEmailEditText"
- inputText: ${USER_EMAIL}
- tapOn:
    id: "send_link_text"
- extendedWaitUntil:
    notVisible:
      id: "recoveryPasswordEmailEditText"
    timeout: 30000
- assertNotVisible:
    text: "No encontramos este correo"
- assertVisible:
    text: "Iniciar sesión|Correo electrónico|¿Olvidaste tu contraseña?"

# Proposito: validar recuperacion del catalogo tras busqueda sin resultados.
# Web parity: tests/regression/catalog/search-no-results-recovery.spec.js
# Precondiciones: SEARCH_NO_RESULTS_TERM sin coincidencias; PRODUCT_SEARCH_TERM valido.
# Valida: estado sin resultados y listado con productos tras nueva busqueda valida.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Regression - Search No Results Recovery
tags:
  - regression
  - catalog
  - search
  - web-parity
---
- runFlow:
    when:
      true: ${(RESET_STATE || "false") == "true"}
    commands:
      - clearState
- runFlow: ../../reusable/ensure-home.yaml
- runFlow: ../../reusable/open-search.yaml
- inputText: ${SEARCH_NO_RESULTS_TERM}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: ".*no hay resultados.*|Más vendidos|mas vendidos|más vendidos|Más buscados"
    timeout: 30000
- assertVisible:
    text: ".*no hay resultados.*"
- assertVisible:
    text: "Más vendidos|mas vendidos|más vendidos|Más buscados"
- runFlow:
    file: ../../reusable/ensure-home.yaml
    env:
      APP_ID_ANDROID: ${APP_ID_ANDROID || "com.enviaflores.android"}
      DEFAULT_STATE: ${DEFAULT_STATE || "Nuevo León"}
      DEFAULT_CITY: ${DEFAULT_CITY || "Monterrey"}
- runFlow: ../../reusable/open-search.yaml
- inputText: ${PRODUCT_SEARCH_TERM}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "rcv_category_products"
    timeout: 30000
- assertVisible:
    id: "rcv_category_products"
- assertVisible:
    text: "Resultados|Resultados para"
- scrollUntilVisible:
    element:
      text: ${PRODUCT_NAME}
    direction: DOWN
    timeout: 45000
- assertVisible:
    text: ${PRODUCT_NAME}

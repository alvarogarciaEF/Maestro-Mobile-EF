# Proposito: validar recuperacion del catalogo tras busqueda sin resultados.
# Web parity: tests/regression/catalog/search-no-results-recovery.spec.js
# Precondiciones: SEARCH_NO_RESULTS_TERM sin coincidencias; PRODUCT_SEARCH_TERM valido.
# Valida: estado sin resultados y listado con productos tras nueva busqueda valida.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Regression - Search No Results Recovery
tags:
  - regression
  - catalog
  - search
  - web-parity
---
- clearState
- runFlow: ../../reusable/ensure-home.yaml
- tapOn:
    id: "toolbar_search"
- assertVisible:
    id: "search_product_input"
- inputText: ${SEARCH_NO_RESULTS_TERM}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      text: "Más vendidos|mas vendidos|más vendidos|Más buscados"
    timeout: 30000
- assertVisible:
    text: "Más vendidos|mas vendidos|más vendidos|Más buscados"
- runFlow: ../../reusable/navigate-home-tab.yaml
- tapOn:
    id: "toolbar_search"
- assertVisible:
    id: "search_product_input"
- inputText: ${PRODUCT_SEARCH_TERM}
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "rcv_category_products"
    timeout: 30000
- assertVisible:
    id: "rcv_category_products"
- assertVisible:
    text: "Resultados|Resultados para"
- scrollUntilVisible:
    element:
      text: ${PRODUCT_NAME}
    direction: DOWN
    timeout: 45000
- assertVisible:
    text: ${PRODUCT_NAME}

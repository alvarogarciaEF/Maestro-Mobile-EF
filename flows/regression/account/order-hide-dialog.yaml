# Proposito: ocultar un pedido desde el modal y verificar que deje de listarse en Mis pedidos.
# Web parity: tests/regression/orders/order-hide-contract.spec.js (parcial)
# Precondiciones: pedido con accion "Ocultar pedido" visible en detalle.
# Valida: confirmacion de ocultado y ausencia del pedido ocultado en el listado.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Regression - Order Hide Dialog
tags:
  - regression
  - account
  - orders
  - web-parity
---
- runFlow:
    when:
      true: ${(RESET_STATE || "false") == "true"}
    commands:
      - clearState
- runFlow: ../../reusable/ensure-logged-in.yaml
- runFlow: ../../reusable/open-hideable-order-detail.yaml
- scrollUntilVisible:
    element:
      text: "Ocultar pedido|Ocultar Pedido|Hide order|Hide Order"
    direction: DOWN
    timeout: 45000
    visibilityPercentage: 50
- tapOn:
    text: "Ocultar pedido|Ocultar Pedido|Hide order|Hide Order"
- extendedWaitUntil:
    visible:
      id: "tv_title"
    timeout: 15000
- assertVisible:
    id: "tv_title"
- assertVisible:
    id: "tv_message"
- assertVisible:
    text: "Ocultar|Hide"
- copyTextFrom:
    id: "tv_title"
- evalScript: ${output.hideOrderModalTitle = maestro.copiedText}
- evalScript: ${output.hiddenOrderId = (output.hideOrderModalTitle.match(/[0-9]+/) || [""])[0]}
- assertTrue:
    condition: ${output.hiddenOrderId != ""}
    label: Se obtuvo el numero de pedido del modal de ocultar
- tapOn:
    text: "Ocultar|Hide"
- extendedWaitUntil:
    notVisible:
      id: "tv_title"
    timeout: 15000
- runFlow: ../../reusable/navigate-account-tab.yaml
- scrollUntilVisible:
    element:
      text: "Mis pedidos"
    direction: DOWN
    timeout: 20000
- tapOn:
    text: "Mis pedidos"
- extendedWaitUntil:
    visible:
      id: "my_orders_fragment_compose_view"
    timeout: 15000
- assertNotVisible:
    text: "Pedido: ${output.hiddenOrderId}"

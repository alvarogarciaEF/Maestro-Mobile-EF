# Proposito: validar llegada a metodo de pago sin ejecutar pago real.
# Precondiciones: usuario QA con direccion guardada o seleccionable.
# Nota: se detiene en la pantalla de pago antes de confirmar compra.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Regression - Checkout Payment Entry
tags:
  - regression
  - checkout
  - payment
---
- runFlow:
    when:
      true: ${(RESET_STATE || "false") == "true"}
    commands:
      - clearState
- runFlow: ../../reusable/ensure-logged-in.yaml
- runFlow: ../../reusable/setup-cart-with-product.yaml
- runFlow: ../../reusable/open-checkout-from-cart.yaml
- runFlow: ../../reusable/advance-checkout-to-payment.yaml
- assertVisible:
    text: "Pago con tarjeta"
- assertVisible:
    text: "Otros métodos de pago"

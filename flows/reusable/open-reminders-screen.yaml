# Proposito: abrir pantalla de recordatorios desde Mi cuenta.
# Precondiciones: usuario autenticado y ubicado en Mi cuenta.
# Valida: pantalla Recordatorios accesible.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Reusable - Open Reminders Screen
---
- scrollUntilVisible:
    element:
      text: "Recordatorios"
    direction: DOWN
    timeout: 15000
- tapOn:
    text: "Recordatorios"
- extendedWaitUntil:
    visible:
      text: "Recordatorios"
    timeout: 15000
- assertVisible:
    text: "Recordatorios"

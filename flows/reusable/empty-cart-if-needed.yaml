# Proposito: dejar el carrito vacio antes de construir escenarios de cart/checkout.
# Precondiciones: Home visible con bottom navigation accesible.
# Valida: estado final "Tu carrito esta vacio" y regreso a Home.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
env:
  APP_ID_ANDROID: ${APP_ID_ANDROID || "com.enviaflores.android"}
  DEFAULT_STATE: ${DEFAULT_STATE || "Nuevo León"}
  DEFAULT_CITY: ${DEFAULT_CITY || "Monterrey"}
  PRODUCT_NAME: ${PRODUCT_NAME}
name: Reusable - Empty Cart If Needed
---
- tapOn:
    id: "action_cart"
- extendedWaitUntil:
    visible:
      id: "cl_shopping_cart"
    timeout: 30000
- runFlow:
    when:
      visible:
        id: "btn_delete"
    commands:
      - tapOn:
          id: "btn_delete"
      - runFlow:
          when:
            visible: "Eliminar"
          commands:
            - tapOn: "Eliminar"
      - runFlow:
          when:
            visible:
              id: "btn_delete"
          commands:
            - tapOn:
                id: "btn_delete"
            - runFlow:
                when:
                  visible: "Eliminar"
                commands:
                  - tapOn: "Eliminar"
      - extendedWaitUntil:
          visible: "Tu carrito está vacío"
          timeout: 20000
- runFlow: navigate-home-tab.yaml
- assertVisible:
    id: "location_date_holder"

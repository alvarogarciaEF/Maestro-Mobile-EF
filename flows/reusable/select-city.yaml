# Proposito: seleccionar estado y ciudad desde el selector de Home.
# Precondiciones: prompts de arranque cerrados; DEFAULT_STATE y DEFAULT_CITY configurados.
# Valida: que la ciudad elegida quede visible y Home listo para buscar/navegar.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
env:
  APP_ID_ANDROID: ${APP_ID_ANDROID || "com.enviaflores.android"}
  DEFAULT_STATE: ${DEFAULT_STATE || "Nuevo León"}
  DEFAULT_CITY: ${DEFAULT_CITY || "Monterrey"}
name: Reusable - Select City
---
- runFlow:
    when:
      visible:
        text: "Estado"
    commands:
      - tapOn:
          text: "${DEFAULT_STATE}"
- runFlow:
    when:
      visible:
        id: "search_store_and_city_input"
    commands:
      - tapOn:
          id: "search_store_and_city_input"
      - eraseText
      - inputText: ${DEFAULT_CITY}
      - hideKeyboard
      - assertVisible:
          id: "txt_title"
          text: "${DEFAULT_CITY}"
      - tapOn:
          id: "txt_title"
          text: "${DEFAULT_CITY}"
- runFlow:
    when:
      visible:
        text: "¿A dónde quieres enviar?"
    commands:
      - runFlow:
          when:
            visible:
              text: "${DEFAULT_CITY}"
          commands:
            - tapOn:
                text: "${DEFAULT_CITY}"
      - runFlow:
          when:
            visible:
              id: "btn_close"
          commands:
            - tapOn:
                id: "btn_close"
- runFlow:
    when:
      visible:
        id: "state_and_city_container"
      notVisible:
        text: "${DEFAULT_CITY}"
    commands:
      - tapOn:
          id: "state_and_city_container"
      - assertVisible:
          text: "¿A dónde quieres enviar?"
      - runFlow:
          when:
            visible:
              text: "Estado"
          commands:
            - tapOn:
                text: "${DEFAULT_STATE}"
      - assertVisible:
          id: "search_store_and_city_input"
      - tapOn:
          id: "search_store_and_city_input"
      - eraseText
      - inputText: ${DEFAULT_CITY}
      - hideKeyboard
      - assertVisible:
          id: "txt_title"
          text: "${DEFAULT_CITY}"
      - tapOn:
          id: "txt_title"
          text: "${DEFAULT_CITY}"
      - runFlow:
          when:
            visible:
              id: "btn_close"
          commands:
            - tapOn:
                id: "btn_close"

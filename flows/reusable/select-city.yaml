# Proposito: seleccionar estado y ciudad desde el selector de Home.
# Precondiciones: DEFAULT_STATE y DEFAULT_CITY configurados.
# Valida: que la ciudad elegida quede visible y Home listo para buscar/navegar.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
env:
  APP_ID_ANDROID: ${APP_ID_ANDROID || "com.enviaflores.android"}
  DEFAULT_STATE: ${DEFAULT_STATE || "Nuevo León"}
  DEFAULT_CITY: ${DEFAULT_CITY || "Monterrey"}
name: Reusable - Select City
---
- runFlow: close-startup-prompts.yaml
- runFlow:
    when:
      visible:
        text: "Estado"
    commands:
      - tapOn:
          text: "${DEFAULT_STATE}"
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      visible:
        id: "search_store_and_city_input"
    commands:
      - tapOn:
          id: "search_store_and_city_input"
      - eraseText
      - inputText: ${DEFAULT_CITY}
      - hideKeyboard
      - extendedWaitUntil:
          visible:
            id: "txt_title"
            text: "${DEFAULT_CITY}"
          timeout: 7000
      - tapOn:
          id: "txt_title"
          text: "${DEFAULT_CITY}"
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      visible:
        text: "¿A dónde quieres enviar?"
    commands:
      - runFlow:
          when:
            visible:
              text: "${DEFAULT_CITY}"
          commands:
            - tapOn:
                text: "${DEFAULT_CITY}"
            - waitForAnimationToEnd:
                timeout: 1000
      - runFlow:
          when:
            visible:
              id: "btn_close"
          commands:
            - tapOn:
                id: "btn_close"
- runFlow:
    when:
      visible:
        id: "state_and_city_container"
      notVisible:
        text: "${DEFAULT_CITY}"
    commands:
      - tapOn:
          id: "state_and_city_container"
      - extendedWaitUntil:
          visible:
            text: "¿A dónde quieres enviar?"
          timeout: 7000
      - runFlow:
          when:
            visible:
              text: "Estado"
          commands:
            - tapOn:
                text: "${DEFAULT_STATE}"
            - waitForAnimationToEnd:
                timeout: 1000
      - extendedWaitUntil:
          visible:
            id: "search_store_and_city_input"
          timeout: 7000
      - tapOn:
          id: "search_store_and_city_input"
      - eraseText
      - inputText: ${DEFAULT_CITY}
      - hideKeyboard
      - extendedWaitUntil:
          visible:
            id: "txt_title"
            text: "${DEFAULT_CITY}"
          timeout: 7000
      - tapOn:
          id: "txt_title"
          text: "${DEFAULT_CITY}"
      - waitForAnimationToEnd:
          timeout: 1000
      - runFlow:
          when:
            visible:
              id: "btn_close"
          commands:
            - tapOn:
                id: "btn_close"

# Proposito: verificar descuento por cupon en resumen del carrito.
# Precondiciones: cupon ya aplicado en carrito.
# Valida: linea Cupon con monto negativo ~COUPON_DISCOUNT_PERCENT% del subtotal.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
env:
  COUPON_CODE: ${COUPON_CODE}
  COUPON_DISCOUNT_PERCENT: ${COUPON_DISCOUNT_PERCENT || "15"}
name: Reusable - Assert Cart Coupon Discount
---
- waitForAnimationToEnd:
    timeout: 3000
- scrollUntilVisible:
    element:
      text: "Resumen del pedido|Cupón|Total"
    direction: DOWN
    timeout: 20000
- extendedWaitUntil:
    visible:
      text: "Cupón|Descuento|-\\$[0-9]"
    timeout: 15000
- assertVisible:
    text: "Cupón"
- assertVisible:
    text: ${COUPON_CODE}
- assertVisible:
    text: "-\\$[0-9,]+"
- copyTextFrom:
    text: "-\\$[0-9,]+"
- evalScript: ${output.couponDiscountText = maestro.copiedText}
- copyTextFrom:
    text: "\\$[0-9]+,[0-9]+"
    below: "Resumen del pedido"
- evalScript: ${output.couponSubtotalText = maestro.copiedText}
- runScript: ../scripts/validate-cart-coupon-discount.js
- assertTrue:
    condition: ${output.couponDiscountOk}
    label: Descuento del cupon ~${COUPON_DISCOUNT_PERCENT}% sobre subtotal
- scrollUntilVisible:
    element:
      text: "Total"
    direction: DOWN
    timeout: 15000
- assertVisible:
    text: "Total"

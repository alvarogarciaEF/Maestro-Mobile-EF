# Proposito: abrir el flujo de recuperacion de contrasena desde login.
# Precondiciones: dialogo de login accesible.
# Valida: pantalla de restablecer contrasena con campo de correo y CTA visible.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Reusable - Open Recover Password
---
- runFlow: open-login-dialog.yaml
- tapOn:
    id: "forgotPassword_label"
- extendedWaitUntil:
    visible:
      id: "recoveryPasswordEmailEditText"
    timeout: 15000
- assertVisible:
    text: "Restablecer contraseña"
- assertVisible:
    text: "Enviar enlace"

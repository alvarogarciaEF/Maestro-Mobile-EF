# Proposito: iniciar sesion con credenciales QA por correo/password desde pantalla de login visible.
# Precondiciones: el usuario ya esta en Mi cuenta y ve "Iniciar sesion".
# Valida: que aparezca el saludo autenticado como senal de sesion iniciada.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
env:
  APP_ID_ANDROID: ${APP_ID_ANDROID || "com.enviaflores.android"}
  USER_EMAIL: ${USER_EMAIL || "enviafloresQA@mailinator.com"}
  USER_PASSWORD: ${USER_PASSWORD || "Prueba1234."}
  USER_DISPLAY_NAME: ${USER_DISPLAY_NAME || "QA Automation"}
name: Reusable - Login Email User
---
- tapOn:
    text: "Iniciar sesión"
- tapOn:
    id: "loginEmailEditText"
- inputText: ${USER_EMAIL}
- tapOn:
    id: "loginPasswordEditText"
- inputText: ${USER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "start_button"
- runFlow: close-modals.yaml
- assertVisible:
    text: "Mi perfil|${USER_DISPLAY_NAME}"

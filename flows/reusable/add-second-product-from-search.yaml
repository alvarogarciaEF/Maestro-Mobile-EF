# Proposito: agregar un segundo producto al carrito desde busqueda.
# Precondiciones: SECOND_PRODUCT_SEARCH_TERM disponible en la ciudad actual.
# Valida: accion "Ir al carrito" visible tras confirmar fecha de entrega.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Reusable - Add Second Product From Search
---
- runFlow: navigate-home-tab.yaml
- tapOn:
    id: "toolbar_search"
- assertVisible:
    id: "search_product_input"
- inputText: ${SECOND_PRODUCT_SEARCH_TERM}
- hideKeyboard
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "rcv_category_products"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "${SECOND_PRODUCT_NAME}"
    direction: DOWN
    timeout: 30000
- tapOn:
    text: "${SECOND_PRODUCT_NAME}"
- extendedWaitUntil:
    visible:
      id: "dateNdeliveryContainer"
    timeout: 30000
- tapOn:
    id: "addToCartButton"
- runFlow: select-delivery-date.yaml
- assertVisible:
    text: "Ir al carrito"

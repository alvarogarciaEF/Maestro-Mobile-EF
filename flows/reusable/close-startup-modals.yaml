# Proposito: cerrar solo prompts frecuentes del arranque/login.
# Precondiciones: app en primer plano.
# Nota: version ligera para rutas criticas; close-modals.yaml queda como fallback amplio.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
name: Reusable - Close Startup Modals
---
- runFlow:
    when:
      visible: "Elige un idioma / Choose a language"
    commands:
      - tapOn:
          text: "Español / Spanish"
      - waitForAnimationToEnd:
          timeout: 1500
      - runFlow:
          when:
            visible: "Elige un idioma / Choose a language"
          commands:
            - tapOn:
                text: "Español / Spanish"
            - waitForAnimationToEnd:
                timeout: 1500
- runFlow:
    when:
      visible: "Confirm|Confirmar|Aceptar"
    commands:
      - tapOn: "Confirm|Confirmar|Aceptar"
      - waitForAnimationToEnd:
          timeout: 1500
- runFlow:
    when:
      visible: "Comenzar"
    commands:
      - tapOn:
          id: "start_button"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Comenzar"
    commands:
      - tapOn:
          id: "start_button"
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible: "Allow|ALLOW|Permitir|Mientras la app está en uso|While using the app"
    commands:
      - tapOn: "Allow|ALLOW|Permitir|Mientras la app está en uso|While using the app"
- runFlow:
    when:
      visible: "No permitir|Don't Allow|Quizá después|Quizá más tarde|Más tarde|Cerrar|Omitir"
    commands:
      - tapOn: "No permitir|Don't Allow|Quizá después|Quizá más tarde|Más tarde|Cerrar|Omitir"
- runFlow:
    when:
      visible: "Save password to Google Password Manager?"
    commands:
      - tapOn: "Not now|Never"

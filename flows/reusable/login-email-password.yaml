# Proposito: iniciar sesion con correo y contrasena QA cuando Google no esta disponible.
# Precondiciones: el usuario ya esta en Mi cuenta y ve "Iniciar sesion".
# Valida: sesion autenticada visible en la pestana Mi cuenta.
appId: ${APP_ID_ANDROID || "com.enviaflores.android"}
env:
  APP_ID_ANDROID: ${APP_ID_ANDROID || "com.enviaflores.android"}
  USER_EMAIL: ${USER_EMAIL || "enviafloresQA@mailinator.com"}
  USER_PASSWORD: ${USER_PASSWORD || "Prueba1234."}
name: Reusable - Login Email Password
---
- tapOn:
    text: "Iniciar sesión"
- assertVisible:
    id: "loginEmailEditText"
- tapOn:
    id: "loginEmailEditText"
- inputText: ${USER_EMAIL}
- tapOn:
    id: "loginPasswordEditText"
- inputText: ${USER_PASSWORD}
- hideKeyboard
- tapOn:
    id: "start_button"
- runFlow:
    when:
      visible: "Save password to Google Password Manager?"
    commands:
      - tapOn:
          text: "Not now|Never"
- runFlow:
    when:
      notVisible:
        text: "Mi perfil|Direcciones|Mis pedidos|Cerrar sesión"
    commands:
      - runFlow: navigate-account-tab.yaml
- extendedWaitUntil:
    visible:
      text: "Mi perfil|Direcciones|Mis pedidos|Cerrar sesión"
    timeout: 15000

# Proposito: ejecutar manualmente smoke tests Android desde GitHub Actions.
# Precondiciones: secrets USER_EMAIL/USER_PASSWORD configurados y runner con soporte mobile.
# Nota: este workflow es on-demand; ajustar runner/emulador antes de usarlo como CI fijo.
name: Maestro Smoke Android

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - dev

jobs:
  smoke-android:
    name: Smoke Android
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      APP_ID_ANDROID: com.enviaflores.android
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      DEFAULT_STATE: Nuevo León
      DEFAULT_CITY: Monterrey
      DEEPLINK_HOME: enviaflores://
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Validate Maestro version
        run: maestro --version

      - name: Install npm metadata
        run: npm install

      - name: Run smoke Android
        run: npm run maestro:smoke:android

      - name: Build JUnit summary
        if: always()
        run: ./scripts/junit-summary.sh "reports/*.xml" "Android Smoke Summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-android-reports
          path: reports/

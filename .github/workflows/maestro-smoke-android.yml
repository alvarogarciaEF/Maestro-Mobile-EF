# Proposito: ejecutar manualmente smoke tests Android desde GitHub Actions.
# Precondiciones: secrets USER_EMAIL/USER_PASSWORD y APK_DOWNLOAD_URL configurados.
# Nota: bootea emulador Android e instala el APK; login.yaml usa Google (requiere cuenta en el AVD). Ver docs/ci-rollout.md.
name: Maestro Smoke Android

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - dev

jobs:
  smoke-android:
    name: Smoke Android
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      APP_ID_ANDROID: com.enviaflores.android
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      DEFAULT_STATE: Nuevo León
      DEFAULT_CITY: Monterrey
      DEEPLINK_HOME: enviaflores://
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node, Maestro y APK
        id: setup
        uses: ./.github/actions/android-maestro
        with:
          apk-download-url: ${{ secrets.APK_DOWNLOAD_URL }}

      - name: Run smoke Android (emulador)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./scripts/install-app.sh android "${{ steps.setup.outputs.apk-path }}"
            npm run maestro:smoke:android

      - name: Build JUnit summary
        if: always()
        run: ./scripts/junit-summary.sh "reports/*.xml" "Android Smoke Summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-android-reports
          path: reports/

# Proposito: ejecutar smoke iOS en modo manual o por PR para validar rutas criticas.
# Precondiciones: secrets USER_EMAIL/USER_PASSWORD y runner macOS con simulador configurado.
# Nota: la app debe estar instalada en el simulador antes de ejecutar la suite.
name: Maestro Smoke iOS

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        required: true
        default: "qa"
        type: choice
        options:
          - qa
          - dev

jobs:
  smoke-ios:
    name: Smoke iOS
    runs-on: macos-latest
    environment: ${{ inputs.environment }}
    env:
      APP_ID_IOS: com.enviaflores.ios
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      DEFAULT_STATE: Nuevo León
      DEFAULT_CITY: Monterrey
      DEEPLINK_HOME: enviaflores://
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Guard - prerequisitos iOS
        run: |
          if ! xcrun simctl list devices booted | grep -q "Booted"; then
            echo "::error::No hay simulador iOS booteado con la app instalada. El CI de iOS es Fase 2: requiere runner macOS con simulador + binario. Ver docs/ci-rollout.md."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Maestro
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Add Maestro to PATH
        run: echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Validate Maestro version
        run: maestro --version

      - name: Install npm metadata
        run: npm install

      - name: Run smoke iOS
        run: npm run maestro:smoke:ios

      - name: Build JUnit summary
        if: always()
        run: ./scripts/junit-summary.sh "reports/*.xml" "iOS Smoke Summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-smoke-ios-reports
          path: reports/

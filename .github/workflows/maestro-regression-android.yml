# Proposito: ejecutar manualmente regression Android desde GitHub Actions.
# Precondiciones: secrets USER_EMAIL/USER_PASSWORD configurados y datos de catalogo vigentes.
# Nota: staging apunta a gateways sandbox; checkout/purchase puede concluir compra solo en modo sandbox.
name: Maestro Regression Android

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - qa
          - dev

jobs:
  regression-android:
    name: Regression Android
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      APP_ID_ANDROID: com.enviaflores.android
      TARGET_ENV: ${{ inputs.environment }}
      CHECKOUT_PURCHASE_MODE: sandbox
      ALLOW_SANDBOX_PURCHASES: auto
      INCLUDE_CHECKOUT_IN_REGRESSION: auto
      USER_EMAIL: ${{ secrets.USER_EMAIL }}
      USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
      DEFAULT_STATE: Nuevo León
      DEFAULT_CITY: Monterrey
      PRODUCT_SEARCH_TERM: rosas
      PRODUCT_NAME: Globo Esfera Magenta con Rosas
      CATEGORY_NAME: Cumpleaños
      DEEPLINK_HOME: enviaflores://
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar Node, Maestro y APK
        id: setup
        uses: ./.github/actions/android-maestro
        with:
          apk-download-url: ${{ secrets.APK_DOWNLOAD_URL }}

      - name: Run regression Android (emulador)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            ./scripts/install-app.sh android "${{ steps.setup.outputs.apk-path }}"
            npm run maestro:regression:android

      - name: Build JUnit summary
        if: always()
        run: ./scripts/junit-summary.sh "reports/*.xml" "Android Regression Summary" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-regression-android-reports
          path: reports/

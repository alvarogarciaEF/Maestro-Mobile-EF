# Proposito: gate estatico en cada PR/push que corre la validacion del framework sin device.
# Precondiciones: ninguna (no requiere emulador, simulador ni app instalada).
# Nota: es el feedback rapido y barato; complementa a los workflows con device.
name: Validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validacion estatica
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install npm metadata
        run: npm install

      # Reusa scripts/validate.sh: YAML, grafo de subflows, comentarios de cabecera,
      # politica de esperas, variables declaradas, seguridad de pagos y credenciales embebidas.
      - name: Run validate
        run: npm run validate
